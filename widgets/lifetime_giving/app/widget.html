<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lifetime Giving</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #F7F4EF;
    color: #1C1C1C;
    font-size: 13px;
    line-height: 1.45;
    padding: 18px 20px 20px;
}

#loading { color: #9A9590; font-size: 12px; padding: 20px 0; text-align: center; }

#no-data { display: none; padding: 24px 0 12px; text-align: center; }
.empty-icon { font-size: 22px; color: #C4BFB6; margin-bottom: 10px; }
.empty-title { font-size: 13px; font-weight: 600; color: #5A5550; margin-bottom: 6px; }
.empty-hint { font-size: 12px; color: #9A9590; line-height: 1.55; max-width: 220px; margin: 0 auto; }

#widget { display: none; }

.wg-header { font-size: 10px; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: #1B5E4F; margin-bottom: 14px; }
.wg-headline { font-size: 30px; font-weight: 700; color: #1B5E4F; letter-spacing: -0.025em; line-height: 1; }
.wg-headline-sub { font-size: 11px; color: #9A9590; margin-top: 3px; margin-bottom: 18px; }

.wg-stats { display: flex; gap: 0; border-top: 1px solid #E4E0D8; padding-top: 14px; margin-bottom: 4px; }
.wg-stat { flex: 1; padding-right: 12px; }
.wg-stat + .wg-stat { padding-right: 0; padding-left: 12px; border-left: 1px solid #E4E0D8; }
.wg-stat-val { font-size: 16px; font-weight: 600; color: #1C1C1C; letter-spacing: -0.01em; }
.wg-amber { color: #B8720A; }
.wg-stat-label { font-size: 10px; color: #9A9590; margin-top: 2px; line-height: 1.3; }

.wg-divider { height: 1px; background: #E4E0D8; margin: 18px 0 14px; }

.wg-chart-label { font-size: 10px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: #9A9590; margin-bottom: 12px; }
.wg-chart { display: flex; flex-direction: column; gap: 9px; }
.wg-bar-row { display: flex; align-items: center; gap: 8px; }
.wg-bar-year { font-size: 11px; font-weight: 500; color: #6B6760; width: 34px; flex-shrink: 0; }
.wg-bar-track { flex: 1; height: 7px; background: #E4E0D8; border-radius: 4px; overflow: hidden; }
.wg-bar-fill { height: 100%; width: 0; background: #3DAA7C; border-radius: 4px; transition: width 0.55s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
.wg-bar-amt { font-size: 11px; font-weight: 500; color: #1C1C1C; text-align: right; min-width: 62px; flex-shrink: 0; }

.wg-footer { margin-top: 18px; font-size: 10px; color: #C4BFB6; border-top: 1px solid #E4E0D8; padding-top: 10px; }
</style>
</head>
<body>
<div id="root">
    <div id="loading">Loading giving data…</div>
    <div id="no-data">
        <div class="empty-icon">◎</div>
        <p class="empty-title">No giving data yet</p>
        <p class="empty-hint">Click <strong>Calculate Giving History</strong> on this Contact to generate the summary.</p>
    </div>
    <div id="widget"></div>
</div>

<script>
function show(id) { document.getElementById(id).style.display = "block"; }
function hide(id) { document.getElementById(id).style.display = "none"; }

function fmt(n) {
    var num = parseFloat(n);
    if (isNaN(num)) return "£0.00";
    return "£" + num.toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function fmtDate(d) {
    if (!d) return "";
    var p = d.split("-");
    if (p.length !== 3) return d;
    var m = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return parseInt(p[2], 10) + " " + m[parseInt(p[1], 10) - 1] + " " + p[0];
}

function parseBreakdown(str) {
    if (!str) return [];
    return str.split(" | ").map(function(part) {
        var halves = part.split(": £");
        if (halves.length !== 2) return null;
        return { year: halves[0].trim(), amount: parseFloat(halves[1]) || 0 };
    }).filter(Boolean);
}

function renderWidget(lifetime, giftAid, lastAmt, lastDate, breakdown, updated) {
    var years  = parseBreakdown(breakdown);
    var maxAmt = years.length > 0 ? Math.max.apply(null, years.map(function(y) { return y.amount; })) : 1;
    var h = "";

    h += '<div class="wg-header">Lifetime Giving</div>';
    h += '<div class="wg-headline">' + fmt(lifetime) + '</div>';
    h += '<div class="wg-headline-sub">total received</div>';

    h += '<div class="wg-stats">';
    h += '<div class="wg-stat"><div class="wg-stat-val wg-amber">' + fmt(giftAid) + '</div><div class="wg-stat-label">Gift Aid received</div></div>';
    if (lastDate) {
        h += '<div class="wg-stat"><div class="wg-stat-val">' + fmt(lastAmt) + '</div><div class="wg-stat-label">Last gift &middot; ' + fmtDate(lastDate) + '</div></div>';
    }
    h += '</div>';

    if (years.length > 0) {
        h += '<div class="wg-divider"></div>';
        h += '<div class="wg-chart-label">Giving by year</div>';
        h += '<div class="wg-chart">';
        years.forEach(function(y) {
            var pct = maxAmt > 0 ? ((y.amount / maxAmt) * 100).toFixed(1) : 0;
            h += '<div class="wg-bar-row">';
            h += '<div class="wg-bar-year">' + y.year + '</div>';
            h += '<div class="wg-bar-track"><div class="wg-bar-fill" data-w="' + pct + '"></div></div>';
            h += '<div class="wg-bar-amt">' + fmt(y.amount) + '</div>';
            h += '</div>';
        });
        h += '</div>';
    }

    if (updated) { h += '<div class="wg-footer">Updated ' + fmtDate(updated) + '</div>'; }

    var el = document.getElementById("widget");
    el.innerHTML = h;
    el.style.display = "block";

    requestAnimationFrame(function() {
        document.querySelectorAll(".wg-bar-fill").forEach(function(bar) {
            bar.style.width = bar.getAttribute("data-w") + "%";
        });
    });
}

// Read values from URL parameters
window.addEventListener("DOMContentLoaded", function() {
    var params   = new URLSearchParams(window.location.search);
    var lifetime = params.get("lifetime") || "";
    var giftAid  = params.get("giftaid")  || "";
    var lastAmt  = params.get("lastamt")  || "";
    var lastDate = params.get("lastdate") || "";
    var breakdown= params.get("breakdown")|| "";
    var updated  = params.get("updated")  || "";

    hide("loading");

    // If Zoho didn't replace the merge tags, params will contain
    // the literal placeholder text — treat as no data
    if (!lifetime || lifetime.indexOf("${") > -1 || (parseFloat(lifetime) === 0 && !breakdown)) {
        show("no-data");
        return;
    }

    renderWidget(lifetime, giftAid, lastAmt, lastDate, breakdown, updated);
});
</script>
</body>
</html>
